apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "instance.name" . }}-stores
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [{{ .Release.Name | quote }}]
      - key: app.kubernetes.io/component
        operator: In
        values: [temporal-db, mongo]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "instance.labels" . | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "instance.name" . }}-temporal
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "instance.selector" (dict "root" . "component" "temporal") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "instance.labels" . | nindent 14 }}
      ports:
        - port: 7233
          protocol: TCP
