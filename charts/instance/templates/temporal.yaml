apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-temporal-db
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  selector: {{- include "instance.selector" (dict "root" . "component" "temporal-db") | nindent 4 }}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "instance.name" . }}-temporal-db
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "instance.name" . }}-temporal-db
  replicas: 1
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" . "component" "temporal-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" . | nindent 8 }}
        {{- include "instance.selector" (dict "root" . "component" "temporal-db") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.temporal.postgresImage }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" . }}-keys
                  key: TEMPORAL_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, temporal]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage.temporalDb }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-temporal
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  selector: {{- include "instance.selector" (dict "root" . "component" "temporal") | nindent 4 }}
  ports:
    - name: grpc
      port: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "instance.name" . }}-temporal
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" . "component" "temporal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" . | nindent 8 }}
        {{- include "instance.selector" (dict "root" . "component" "temporal") | nindent 8 }}
    spec:
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          ports:
            - containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" . }}-keys
                  key: TEMPORAL_DB_PASSWORD
            - name: POSTGRES_SEEDS
              value: {{ include "instance.name" . }}-temporal-db
            - name: BIND_ON_IP
              value: 0.0.0.0
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 20
            periodSeconds: 10
