apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-temporal-db
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  selector: {{- include "instance.selector" (dict "root" . "component" "temporal-db") | nindent 4 }}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "instance.name" . }}-temporal-db
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "instance.name" . }}-temporal-db
  replicas: 1
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" . "component" "temporal-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" . | nindent 8 }}
        {{- include "instance.selector" (dict "root" . "component" "temporal-db") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.temporal.postgresImage }}
          {{- include "instance.resources" (dict "root" . "component" "temporalDb") | nindent 10 }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" . }}-keys
                  key: TEMPORAL_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, temporal]
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage.temporalDb }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-temporal
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  selector: {{- include "instance.selector" (dict "root" . "component" "temporal") | nindent 4 }}
  ports:
    - name: grpc
      port: 7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "instance.name" . }}-temporal
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" . "component" "temporal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" . | nindent 8 }}
        {{- include "instance.selector" (dict "root" . "component" "temporal") | nindent 8 }}
    spec:
      initContainers:
        - name: temporal-jwks
          image: {{ include "instance.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [temporal-keys, /keys/temporal-jwks.json]
          {{- include "instance.resources" (dict "root" . "component" "temporalJwks") | nindent 10 }}
          env:
            - name: TEMPORAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" . }}-keys
                  key: TEMPORAL_KEY
          volumeMounts:
            - name: temporal-keys
              mountPath: /keys
        - name: temporal-keys
          image: {{ .Values.temporal.keysImage }}
          restartPolicy: Always
          command: [httpd, -f, -p, "7280", -h, /srv]
          {{- include "instance.resources" (dict "root" . "component" "temporalKeys") | nindent 10 }}
          startupProbe:
            httpGet:
              path: /.well-known/temporal-jwks.json
              port: 7280
            periodSeconds: 1
            failureThreshold: 600
          volumeMounts:
            - name: temporal-keys
              mountPath: /srv/.well-known
              readOnly: true
      volumes:
        - name: temporal-keys
          emptyDir: {}
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          {{- include "instance.resources" (dict "root" . "component" "temporal") | nindent 10 }}
          ports:
            - containerPort: 7233
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" . }}-keys
                  key: TEMPORAL_DB_PASSWORD
            - name: POSTGRES_SEEDS
              value: {{ include "instance.name" . }}-temporal-db
            - name: BIND_ON_IP
              value: 0.0.0.0
            - name: SERVICES
              value: frontend:internal-frontend:history:matching:worker
            - name: USE_INTERNAL_FRONTEND
              value: "true"
            - name: TEMPORAL_ADDRESS
              value: 127.0.0.1:7236
            - name: TEMPORAL_AUTH_AUTHORIZER
              value: default
            - name: TEMPORAL_AUTH_CLAIM_MAPPER
              value: default
            - name: TEMPORAL_JWT_KEY_SOURCE1
              value: http://127.0.0.1:7280/.well-known/temporal-jwks.json
            - name: TEMPORAL_JWT_KEY_REFRESH
              value: 30s
            - name: TEMPORAL_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 20
            periodSeconds: 10
