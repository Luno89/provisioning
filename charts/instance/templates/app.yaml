{{- $processes := list "backend" "worker-engine" "worker-cluster" "worker-host" -}}
{{- range $process := $processes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "instance.name" $ }}-{{ $process }}
  labels: {{- include "instance.labels" $ | nindent 4 }}
spec:
  replicas: {{ if $.Values.move.enabled }}0{{ else }}1{{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" $ "component" $process) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" $ | nindent 8 }}
        {{- include "instance.selector" (dict "root" $ "component" $process) | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "instance.name" $ }}
      {{- if eq $process "backend" }}
      terminationGracePeriodSeconds: {{ $.Values.backend.terminationGraceSeconds }}
      {{- end }}
      initContainers:
        - name: wait-for-mongo
          image: {{ include "instance.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: [sh, -c, "until node -e \"require('net').connect(27017, '{{ include "instance.name" $ }}-mongo').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\"; do sleep 2; done"]
      containers:
        - name: {{ $process }}
          image: {{ include "instance.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $process | quote }}]
          {{- include "instance.resources" (dict "root" $ "component" $process) | nindent 10 }}
          envFrom:
            - configMapRef:
                name: {{ include "instance.name" $ }}-env
            - secretRef:
                name: {{ include "instance.name" $ }}-keys
            {{- if $.Values.instance.credential }}
            - secretRef:
                name: {{ include "instance.name" $ }}-instance
            {{- end }}
          env:
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" $ }}-keys
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URI
              value: mongodb://admin:$(MONGO_ROOT_PASSWORD)@{{ include "instance.name" $ }}-mongo:27017/provisioning?authSource=admin
            {{- if eq $process "backend" }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PORT
              value: "3001"
          ports:
            - name: http
              containerPort: 3001
            - name: machine-gateway
              containerPort: 7234
          readinessProbe:
            httpGet:
              path: /api/auth/sign-in
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            {{- else }}
            - name: HEALTH_PORT
              value: "8090"
          ports:
            - name: health
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/apps/backend/data
            - name: temporal-ca
              mountPath: /etc/koala/temporal-tls
              readOnly: true
            {{- if and (eq $process "backend") $.Values.routing.domain }}
            - name: edge-config
              mountPath: /etc/edge
              readOnly: true
            {{- end }}
            {{- if and (eq $process "worker-host") (include "instance.hostDocker" $) }}
            - name: docker-socket
              mountPath: /var/run/docker.sock
            {{- end }}
        {{- if and (eq $process "backend") $.Values.routing.domain }}
        - name: edge
          image: {{ $.Values.edge.image }}
          args: [caddy, run, --config, /etc/edge/Caddyfile]
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "until ! wget -q -O /dev/null http://127.0.0.1:3001/api/auth/sign-in; do sleep 0.5; done"]
          {{- include "instance.resources" (dict "root" $ "component" "edge") | nindent 10 }}
          ports:
            - name: edge
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/apps/backend/data
              readOnly: true
            - name: edge-config
              mountPath: /etc/edge
              readOnly: true
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "instance.name" $ }}-data
        - name: temporal-ca
          secret:
            secretName: {{ include "instance.name" $ }}-temporal-tls
            items:
              - key: ca.crt
                path: ca.crt
        {{- if and (eq $process "backend") $.Values.routing.domain }}
        - name: edge-config
          configMap:
            name: {{ include "instance.name" $ }}-edge
        {{- end }}
        {{- if and (eq $process "worker-host") (include "instance.hostDocker" $) }}
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  type: {{ if .Values.backend.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  selector: {{- include "instance.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if .Values.backend.nodePort }}
      nodePort: {{ .Values.backend.nodePort }}
      {{- end }}
{{- if .Values.mesh.address }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-machine-gateway
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "instance.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: machine-gateway
      port: 7234
      targetPort: machine-gateway
      nodePort: {{ .Values.machineGateway.nodePort }}
{{- end }}
{{- if .Values.routing.domain }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-edge
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  type: {{ if .Values.edge.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  selector: {{- include "instance.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: edge
      port: 80
      targetPort: edge
      {{- if .Values.edge.nodePort }}
      nodePort: {{ .Values.edge.nodePort }}
      {{- end }}
{{- end }}
