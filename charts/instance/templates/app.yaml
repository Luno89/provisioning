{{- $processes := list "backend" "worker-engine" "worker-cluster" "worker-host" -}}
{{- if and .Values.dev.coverage (not .Values.dev.source) }}{{ fail "dev.coverage measures a dev instance's own checkout: it needs dev.source" }}{{ end -}}
{{- if and .Values.dev.coverage (not (hasPrefix "/" .Values.dev.coverage)) }}{{ fail "dev.coverage is a folder on the host, named from /" }}{{ end -}}
{{- range $process := $processes }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "instance.name" $ }}-{{ $process }}
  labels: {{- include "instance.labels" $ | nindent 4 }}
spec:
  replicas: {{ if $.Values.move.enabled }}0{{ else }}1{{ end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" $ "component" $process) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" $ | nindent 8 }}
        {{- include "instance.selector" (dict "root" $ "component" $process) | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "instance.name" $ }}
      {{- if $.Values.dev.coverage }}
      hostPID: true
      {{- end }}
      {{- with $.Values.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $process "backend" }}
      terminationGracePeriodSeconds: {{ $.Values.backend.terminationGraceSeconds }}
      {{- end }}
      initContainers:
        - name: wait-for-mongo
          image: {{ include "instance.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: [sh, -c, "until node -e \"require('net').connect(27017, '{{ include "instance.name" $ }}-mongo').on('connect', () => process.exit(0)).on('error', () => process.exit(1))\"; do sleep 2; done"]
      containers:
        - name: {{ $process }}
          image: {{ include "instance.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $process | quote }}]
          {{- include "instance.resources" (dict "root" $ "component" $process) | nindent 10 }}
          envFrom:
            - configMapRef:
                name: {{ include "instance.name" $ }}-env
            - secretRef:
                name: {{ include "instance.name" $ }}-keys
            - secretRef:
                name: {{ include "instance.name" $ }}-instance
          env:
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" $ }}-keys
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URI
              value: mongodb://admin:$(MONGO_ROOT_PASSWORD)@{{ include "instance.name" $ }}-mongo:27017/provisioning?authSource=admin
            {{- if $.Values.dev.source }}
            - name: DEV_WATCH
              value: "true"
            {{- end }}
            {{- with $.Values.dev.coverage }}
            - name: COUPLING_LIVE_DIR
              value: {{ . | quote }}
            - name: NODE_V8_COVERAGE
              value: {{ printf "%s/raw" . | quote }}
            - name: NODE_OPTIONS
              value: "--enable-source-maps --import /app/tests/coupling/live-hook.mjs"
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if eq $process "backend" }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PORT
              value: {{ $.Values.backend.port | quote }}
            - name: MACHINE_GATEWAY_PORT
              value: {{ $.Values.machineGateway.port | quote }}
          ports:
            - name: http
              containerPort: {{ $.Values.backend.port }}
            - name: machine-gateway
              containerPort: {{ $.Values.machineGateway.port }}
          readinessProbe:
            httpGet:
              path: /api/auth/sign-in
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            {{- else }}
            - name: HEALTH_PORT
              value: {{ $.Values.workers.healthPort | quote }}
            - name: {{ if eq $process "worker-engine" }}TEMPORAL_ENGINE_METRICS_PORT{{ else }}TEMPORAL_METRICS_PORT{{ end }}
              value: {{ $.Values.workers.temporalMetricsPort | quote }}
          ports:
            - name: health
              containerPort: {{ $.Values.workers.healthPort }}
            - name: temporal-metrics
              containerPort: {{ $.Values.workers.temporalMetricsPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            {{- end }}
          volumeMounts:
            {{- if $.Values.dev.source }}
            - name: source
              mountPath: /app
              readOnly: true
            {{- end }}
            {{- with $.Values.dev.coverage }}
            - name: coverage
              mountPath: {{ . }}
            {{- end }}
            - name: data
              mountPath: /app/apps/backend/data
            - name: temporal-ca
              mountPath: /etc/koala/temporal-tls
              readOnly: true
            {{- if eq $process "backend" }}
            - name: edge-config
              mountPath: /etc/edge
              readOnly: true
            {{- end }}
        {{- if eq $process "backend" }}
        - name: edge
          image: {{ $.Values.edge.image }}
          args: [caddy, run, --config, /etc/edge/Caddyfile]
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "until ! wget -q -O /dev/null http://127.0.0.1:{{ $.Values.backend.port }}/api/auth/sign-in; do sleep 0.5; done"]
          {{- include "instance.resources" (dict "root" $ "component" "edge") | nindent 10 }}
          ports:
            - name: edge
              containerPort: 8080
            - name: local-apps
              containerPort: {{ $.Values.edge.localPort }}
          volumeMounts:
            - name: data
              mountPath: /app/apps/backend/data
              readOnly: true
            - name: edge-config
              mountPath: /etc/edge
              readOnly: true
        {{- end }}
      volumes:
        {{- if $.Values.dev.source }}
        - name: source
          hostPath:
            path: {{ $.Values.dev.source }}
            type: Directory
        {{- end }}
        {{- with $.Values.dev.coverage }}
        - name: coverage
          hostPath:
            path: {{ . }}
            type: Directory
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "instance.name" $ }}-data
        - name: temporal-ca
          secret:
            secretName: {{ include "instance.name" $ }}-temporal-tls
            items:
              - key: ca.crt
                path: ca.crt
        {{- if eq $process "backend" }}
        - name: edge-config
          configMap:
            name: {{ include "instance.name" $ }}-edge
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  type: {{ if .Values.backend.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  selector: {{- include "instance.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if .Values.backend.nodePort }}
      nodePort: {{ .Values.backend.nodePort }}
      {{- end }}
{{- if .Values.mesh.address }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-machine-gateway
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: {{- include "instance.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: machine-gateway
      port: {{ .Values.machineGateway.port }}
      targetPort: machine-gateway
      nodePort: {{ .Values.machineGateway.nodePort }}
{{- end }}
{{- if .Values.routing.domain }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-edge
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  type: {{ if .Values.edge.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  selector: {{- include "instance.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: edge
      port: 80
      targetPort: edge
      {{- if .Values.edge.nodePort }}
      nodePort: {{ .Values.edge.nodePort }}
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-edge-local
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "instance.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: local-apps
      port: {{ .Values.edge.localPort }}
      targetPort: local-apps
{{- if not .Values.pool.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "instance.name" . }}-local-apps
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.move.enabled }}0{{ else }}1{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" . "component" "local-apps") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" . | nindent 8 }}
        {{- include "instance.selector" (dict "root" . "component" "local-apps") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: forward
          image: {{ .Values.edge.image }}
          args:
            - caddy
            - reverse-proxy
            - --from
            - {{ printf ":%v" .Values.edge.localPort | quote }}
            - --to
            - {{ printf "%s-edge-local.%s.svc.cluster.local:%v" (include "instance.name" .) .Release.Namespace .Values.edge.localPort | quote }}
          {{- include "instance.resources" (dict "root" . "component" "local-apps") | nindent 10 }}
          ports:
            - name: local-apps
              containerPort: {{ .Values.edge.localPort }}
              hostPort: {{ .Values.edge.localPort }}
              hostIP: 127.0.0.1
{{- end }}
