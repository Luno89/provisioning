{{- $required := list "id" "ownerId" "rootUrl" "rootPublicKeys" "credential" -}}
{{- range $required }}{{ if not (index $.Values.instance .) }}{{ fail (printf "instance.%s is required" .) }}{{ end }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "instance.name" . }}-env
  labels: {{- include "instance.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  ROLE: instance
  KOALA_RELEASE_REVISION: {{ .Release.Revision | quote }}
  INSTANCE_ID: {{ .Values.instance.id | quote }}
  INSTANCE_OWNER_ID: {{ .Values.instance.ownerId | quote }}
  {{- with .Values.instance.machineId }}
  INSTANCE_MACHINE_ID: {{ . | quote }}
  {{- end }}
  ROOT_URL: {{ .Values.instance.rootUrl | quote }}
  ROOT_PUBLIC_KEYS: {{ .Values.instance.rootPublicKeys | quote }}
  PUBLIC_URL: {{ required "publicUrl is required: it is the address people reach this instance at" .Values.publicUrl | quote }}
  APP_URL: {{ .Values.publicUrl | quote }}
  TRUST_PROXY: "1"
  TEMPORAL_CONNECTION_ADDRESS: {{ include "instance.name" . }}-temporal:7233
  TEMPORAL_NAMESPACE: {{ required "temporal.namespace is required" .Values.temporal.namespace | quote }}
  TEMPORAL_TLS_CA: /etc/koala/temporal-tls/ca.crt
  DATA_DIR: /app/apps/backend/data
  MINIO_ENDPOINT: {{ include "instance.name" . }}-minio:9000
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}
  {{- if .Values.mesh.loginServer }}
  MESH_LOGIN_SERVER: {{ .Values.mesh.loginServer | quote }}
  {{- end }}
  {{- if .Values.mesh.address }}
  MACHINE_TEMPORAL_ADDRESS: {{ printf "%s:%v" .Values.mesh.address .Values.machineGateway.nodePort | quote }}
  MACHINE_GATEWAY_TLS_CERT: /etc/koala/machine-gateway-tls/tls.crt
  MACHINE_GATEWAY_TLS_KEY: /etc/koala/machine-gateway-tls/tls.key
  {{- end }}
  {{- if and .Values.mesh.address .Values.backend.nodePort }}
  MACHINE_METRICS_URL: {{ printf "http://%s:%v/api/machines/metrics" .Values.mesh.address .Values.backend.nodePort | quote }}
  {{- end }}
  {{- if .Values.routing.domain }}
  INGRESS_DOMAIN: {{ .Values.routing.domain | quote }}
  INSTANCE_NAME: {{ required "routing.name is required with routing.domain" .Values.routing.name | quote }}
  {{- end }}
  EDGE_ADMIN_URL: http://localhost:2019
  EDGE_CADDYFILE: /etc/edge/Caddyfile
  EDGE_SITES: /app/apps/backend/data/caddy/apps
  {{- if not .Values.pool.enabled }}
  EDGE_LOCAL_PORT: {{ .Values.edge.localPort | quote }}
  {{- end }}
  GITEA_URL: http://gitea-http.gitea.svc.cluster.local:3000
  INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
  KOALA_REGISTRY_PUSH: gitea-http.gitea.svc.cluster.local:3000
  {{- if .Values.pool.enabled }}
  POOL: "true"
  REGISTRY_PULL_HOST: {{ required "pool.registryPullHost is required in a pool instance" .Values.pool.registryPullHost | quote }}
  KOALA_REGISTRY: {{ .Values.pool.registryPullHost | quote }}
  {{- else }}
  REGISTRY_PULL_HOST: {{ .Values.registry.pullHost | quote }}
  KOALA_REGISTRY: {{ .Values.registry.pullHost | quote }}
  {{- end }}
  SEARXNG_URL: http://searxng.searxng.svc.cluster.local:8080
  CRAWL4AI_URL: http://crawl4ai.crawl4ai.svc.cluster.local:11235
  CHECKS_API_URL: http://{{ include "instance.name" . }}.{{ .Release.Namespace }}.svc.cluster.local/api
  GITEA_REACHES_KOALA_AT: http://{{ include "instance.name" . }}.{{ .Release.Namespace }}.svc.cluster.local
  SELF_UPGRADE_CRONJOB: {{ include "instance.name" . }}-self-upgrade
  INSTANCE_NAMESPACE: {{ .Release.Namespace | quote }}
  TERRAFORM_STATE: kubernetes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "instance.name" . }}-edge
  labels: {{- include "instance.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {
    	admin localhost:2019
    	auto_https off
    	http_port 8080
    	persist_config off
    }

    import /app/apps/backend/data/caddy/apps/*.caddy

    :8080 {
    	header X-Koala-Edge {{ .Values.routing.name | quote }}
    	respond 404
    }

    :{{ .Values.edge.localPort }} {
    	respond "No app is exposed at this address on this computer." 404
    }
