{{- $required := list "id" "ownerId" "rootUrl" "rootPublicKeys" -}}
{{- range $required }}{{ if not (index $.Values.instance .) }}{{ fail (printf "instance.%s is required" .) }}{{ end }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "instance.name" . }}-env
  labels: {{- include "instance.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  ROLE: instance
  INSTANCE_ID: {{ .Values.instance.id | quote }}
  INSTANCE_OWNER_ID: {{ .Values.instance.ownerId | quote }}
  ROOT_URL: {{ .Values.instance.rootUrl | quote }}
  ROOT_PUBLIC_KEYS: {{ .Values.instance.rootPublicKeys | quote }}
  PUBLIC_URL: {{ .Values.publicUrl | default "http://localhost:3001" | quote }}
  TEMPORAL_CONNECTION_ADDRESS: {{ include "instance.name" . }}-temporal:7233
  {{- if .Values.mesh.loginServer }}
  MESH_LOGIN_SERVER: {{ .Values.mesh.loginServer | quote }}
  {{- end }}
  {{- if .Values.mesh.address }}
  MACHINE_TEMPORAL_ADDRESS: {{ printf "%s:7233" .Values.mesh.address | quote }}
  {{- end }}
  {{- if .Values.routing.domain }}
  INGRESS_DOMAIN: {{ .Values.routing.domain | quote }}
  INSTANCE_NAME: {{ required "routing.name is required with routing.domain" .Values.routing.name | quote }}
  EDGE_ADMIN_URL: http://localhost:2019
  EDGE_CADDYFILE: /etc/edge/Caddyfile
  {{- end }}
  {{- if .Values.pool.enabled }}
  POOL: "true"
  GITEA_URL: http://gitea-http.gitea.svc.cluster.local:3000
  INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
  REGISTRY_PULL_HOST: {{ required "pool.registryPullHost is required in a pool instance" .Values.pool.registryPullHost | quote }}
  KOALA_REGISTRY: {{ .Values.pool.registryPullHost | quote }}
  KOALA_REGISTRY_PUSH: gitea-http.gitea.svc.cluster.local:3000
  {{- end }}
  SEARXNG_URL: http://searxng.searxng.svc.cluster.local:8080
  CRAWL4AI_URL: http://crawl4ai.crawl4ai.svc.cluster.local:11235
  KUBECONFIG_PATH: /tmp/kubeconfig-provisioning-lunorica
  IN_CLUSTER: "true"
{{- if .Values.routing.domain }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "instance.name" . }}-edge
  labels: {{- include "instance.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {
    	admin localhost:2019
    	auto_https off
    	http_port 8080
    	persist_config off
    }

    import /app/apps/backend/data/caddy/apps/*.caddy

    :8080 {
    	header X-Koala-Edge {{ .Values.routing.name | quote }}
    	respond 404
    }
{{- end }}
