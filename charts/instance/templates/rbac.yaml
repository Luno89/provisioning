apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "instance.name" . }}
  labels: {{- include "instance.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "instance.name" . }}-{{ .Release.Namespace }}-owns-cluster
  labels: {{- include "instance.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "instance.name" . }}
    namespace: {{ .Release.Namespace }}
