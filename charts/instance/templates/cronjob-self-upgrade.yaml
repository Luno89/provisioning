{{- if .Values.instance.credential }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "instance.name" . }}-self-upgrade
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.selfUpgrade.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels: {{- include "instance.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "instance.name" . }}
          restartPolicy: Never
          containers:
            - name: self-upgrade
              image: {{ include "instance.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["self-upgrade"]
              envFrom:
                - configMapRef:
                    name: {{ include "instance.name" . }}-env
                - secretRef:
                    name: {{ include "instance.name" . }}-instance
              env:
                - name: RELEASE_NAME
                  value: {{ .Release.Name }}
                - name: RELEASE_NAMESPACE
                  value: {{ .Release.Namespace }}
                - name: CURRENT_IMAGE_TAG
                  value: {{ .Values.image.tag | quote }}
                - name: UPGRADE_TIMEOUT
                  value: {{ .Values.selfUpgrade.timeout | quote }}
{{- end }}
