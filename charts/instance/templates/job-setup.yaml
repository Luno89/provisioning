{{- $steps := list "seed" }}
{{- $name := include "instance.name" . }}
{{- range $index, $step := $steps }}
{{- $after := list }}
{{- range $before := slice $steps 0 $index }}
{{- $after = append $after (printf "%s-%s-%d" $name $before (int $.Release.Revision)) }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-{{ $step }}-{{ $.Release.Revision }}
  labels:
    {{- include "instance.labels" $ | nindent 4 }}
    koala.app/setup: {{ $step }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {{- include "instance.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with $.Values.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
        - name: waits
          image: {{ include "instance.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["setup-waits"]
          envFrom:
            - configMapRef:
                name: {{ $name }}-env
            - secretRef:
                name: {{ $name }}-keys
            - secretRef:
                name: {{ $name }}-instance
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SETUP_STEP
              value: {{ $step | quote }}
            - name: SETUP_AFTER
              value: {{ join " " $after | quote }}
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-keys
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URI
              value: mongodb://admin:$(MONGO_ROOT_PASSWORD)@{{ $name }}-mongo:27017/provisioning?authSource=admin
          {{- if $.Values.dev.source }}
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
          {{- end }}
      containers:
        - name: {{ $step }}
          image: {{ include "instance.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $step | quote }}]
          envFrom:
            - configMapRef:
                name: {{ $name }}-env
            - secretRef:
                name: {{ $name }}-keys
            - secretRef:
                name: {{ $name }}-instance
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-keys
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URI
              value: mongodb://admin:$(MONGO_ROOT_PASSWORD)@{{ $name }}-mongo:27017/provisioning?authSource=admin
          volumeMounts:
            {{- if $.Values.dev.source }}
            - name: source
              mountPath: /app
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /app/apps/backend/data
      volumes:
        {{- if $.Values.dev.source }}
        - name: source
          hostPath:
            path: {{ $.Values.dev.source }}
            type: Directory
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
{{- end }}
