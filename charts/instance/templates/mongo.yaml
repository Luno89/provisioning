apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-mongo
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  selector: {{- include "instance.selector" (dict "root" . "component" "mongo") | nindent 4 }}
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "instance.name" . }}-mongo
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "instance.name" . }}-mongo
  replicas: 1
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" . "component" "mongo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" . | nindent 8 }}
        {{- include "instance.selector" (dict "root" . "component" "mongo") | nindent 8 }}
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" . }}-keys
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: provisioning
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage.mongo }}
