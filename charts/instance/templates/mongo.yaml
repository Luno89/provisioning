apiVersion: v1
kind: Service
metadata:
  name: {{ include "instance.name" . }}-mongo
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  selector: {{- include "instance.selector" (dict "root" . "component" "mongo") | nindent 4 }}
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "instance.name" . }}-mongo-stores
  labels: {{- include "instance.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "instance.name" . }}-mongo
  replicas: 1
  selector:
    matchLabels: {{- include "instance.selector" (dict "root" . "component" "mongo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "instance.labels" . | nindent 8 }}
        {{- include "instance.selector" (dict "root" . "component" "mongo") | nindent 8 }}
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          command: [sh, -c]
          args:
            - |
              umask 077
              printf '%s' "$MONGO_INITDB_ROOT_PASSWORD" | sha256sum | cut -c1-64 > /tmp/mongo-keyfile
              chown mongodb:mongodb /tmp/mongo-keyfile
              exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/mongo-keyfile --bind_ip_all
          {{- include "instance.resources" (dict "root" . "component" "mongo") | nindent 10 }}
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "instance.name" . }}-keys
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: provisioning
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: stores
              mountPath: /data/db
              subPath: stores/mongo
      volumes:
        - name: stores
          persistentVolumeClaim:
            claimName: {{ include "instance.name" . }}-data
