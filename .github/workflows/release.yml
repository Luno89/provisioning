name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The tag was made by npm run release
        run: |
          [ -n "${ACT:-}" ] || git fetch --force origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          [ "$(git cat-file -t "refs/tags/${VERSION}")" = tag ] || { echo "::error::${VERSION} is not an annotated tag; npm run release makes them"; exit 1; }
          git cat-file tag "refs/tags/${VERSION}" | grep -qE '^(Shipped and released|Hotfix released) from ' || { echo "::error::${VERSION} was not made by npm run release"; exit 1; }
          git -c gpg.ssh.allowedSignersFile=scripts/root-node/release-signers verify-tag "refs/tags/${VERSION}" || { echo "::error::${VERSION} is not signed by a key in scripts/root-node/release-signers"; exit 1; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nowrinkles/app" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse "refs/tags/${VERSION}^{commit}" | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Every CDKTF provider has its bindings in the checkout
        run: |
          node -e '
            const fs = require("fs");
            const providers = require("./packages/cdktf-infra/cdktf.json").terraformProviders;
            const missing = providers.filter((p) => !fs.existsSync(`packages/cdktf-infra/.gen/providers/${p.split("@")[0].split("/").pop()}`));
            if (missing.length) { console.log(`::error::no CDKTF bindings committed for ${missing.join(", ")}`); process.exit(1); }
          '

      - name: Room for the image
        if: ${{ !env.ACT }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: ${{ !env.ACT }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ !env.ACT }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest that this workflow built the image from the signed tag
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.15.1

      - name: Package the instance chart
        run: |
          mkdir -p dist
          helm package charts/instance --app-version "${VERSION}" --destination dist
          mv dist/instance-*.tgz "dist/instance-${VERSION}.tgz"

      - name: The release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${ACT:-}" ]; then digest="(not published under act)"; else
            digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          fi
          {
            git cat-file tag "refs/tags/${VERSION}" | sed '1,/^$/d'
            echo
            echo "Image: \`${IMAGE}:${VERSION}\` (\`${IMAGE}@${digest}\`)"
            echo
            echo "Chart: \`instance-${VERSION}.tgz\`, below."
          } > notes.md
          if [ -n "${ACT:-}" ]; then
            echo "under act, nothing is released; it would post dist/instance-${VERSION}.tgz ($(du -h "dist/instance-${VERSION}.tgz" | cut -f1)) with these notes:"
            cat notes.md
            exit 0
          fi
          gh release create "${VERSION}" "dist/instance-${VERSION}.tgz" --title "${VERSION}" --notes-file notes.md --verify-tag
