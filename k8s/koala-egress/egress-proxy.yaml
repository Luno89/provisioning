# The one way out of a sandbox.
#
# Sandboxes have no DNS resolver and no general egress (see lib/workspace-spec.ts). They reach
# anything outside only by sending CONNECT to this proxy, which resolves the name itself. Without a
# credential it reaches the package registries below and nothing else. A persona that was granted a
# host sends a credential of its own, and the grants file lets exactly that credential reach exactly
# those hosts and ports — so a grant widens one persona, never every sandbox.
#
# `http_access deny all` is the load-bearing line: anything not allowed above it is refused.
apiVersion: v1
kind: Namespace
metadata:
  name: koala-egress
  labels:
    name: koala-egress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: squid-conf
  namespace: koala-egress
data:
  squid.conf: |
    http_port 8888
    auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/grants/passwd
    auth_param basic realm koala-egress
    acl CONNECT method CONNECT
    acl https port 443
    acl registries dstdomain .npmjs.org pypi.org files.pythonhosted.org proxy.golang.org sum.golang.org
    http_access allow CONNECT https registries
    include /etc/squid/grants/acls.conf
    http_access deny all
    cache deny all
    access_log none
---
# Written by the backend's EgressProxyService from the active grants; this is only the empty start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-grants
  namespace: koala-egress
data:
  passwd: ""
  acls.conf: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: koala-egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-proxy
  template:
    metadata:
      labels:
        app: egress-proxy
    spec:
      initContainers:
        - name: grants
          image: docker.io/ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
          command: ["sh", "-c", "cp /seed/passwd /seed/acls.conf /etc/squid/grants/ && chmod 644 /etc/squid/grants/*"]
          volumeMounts:
            - { name: grants-seed, mountPath: /seed }
            - { name: grants, mountPath: /etc/squid/grants }
      containers:
        - name: squid
          image: docker.io/ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
          command: ["squid", "-N", "-d", "1", "-f", "/etc/squid/squid.conf"]
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - { name: conf, mountPath: /etc/squid/squid.conf, subPath: squid.conf }
            - { name: grants, mountPath: /etc/squid/grants }
      volumes:
        - name: conf
          configMap:
            name: squid-conf
        - name: grants-seed
          configMap:
            name: egress-grants
        - name: grants
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: koala-egress
spec:
  selector:
    app: egress-proxy
  ports:
    - port: 8888
      targetPort: 8888
