apiVersion: v1
kind: Namespace
metadata:
  name: tei
  labels:
    name: tei
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei-cache-pvc
  namespace: tei
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei
  namespace: tei
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tei
  template:
    metadata:
      labels:
        app: tei
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
          args:
            - --model-id
            - BAAI/bge-small-en-v1.5
            - --revision
            - 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
            - --port
            - "80"
          env:
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          ports:
            - containerPort: 80
          volumeMounts:
            - name: cache
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 80
          resources:
            limits:
              memory: 2Gi
              cpu: 2000m
            requests:
              memory: 512Mi
              cpu: 250m
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: tei-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tei
  namespace: tei
spec:
  selector:
    app: tei
  ports:
    - port: 80
      targetPort: 80
