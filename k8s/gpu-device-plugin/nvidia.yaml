apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1@sha256:27c1b2553a690ca3d29889dcd61df97525d46f58272c0be8dc63c2b18f120075
          name: nvidia-device-plugin-ctr
          command: ["nvidia-device-plugin"]
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "true"
            - name: DEVICE_DISCOVERY_STRATEGY
              value: nvml
            - name: DEVICE_LIST_STRATEGY
              value: cdi-cri
            - name: NVIDIA_DRIVER_ROOT
              value: /
            - name: NVIDIA_CDI_HOOK_PATH
              value: /usr/bin/nvidia-cdi-hook
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: kubelet-device-plugins-dir
              mountPath: /var/lib/kubelet/device-plugins
            - name: driver-root
              mountPath: /driver-root
              readOnly: true
            - name: cdi-root
              mountPath: /var/run/cdi
      volumes:
        - name: kubelet-device-plugins-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: driver-root
          hostPath:
            path: /
            type: Directory
        - name: cdi-root
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
