apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-worker
  namespace: default
  labels:
    app: provisioning-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioning-worker
  template:
    metadata:
      labels:
        app: provisioning-worker
    spec:
      serviceAccountName: provisioning-worker
      containers:
        - name: worker
          image: deployworker.sh
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_CONNECTION_ADDRESS
              value: "host.k3d.internal:7233"
            - name: TEMPORAL_TASK_QUEUE
              value: "cluster-ops-queue"
            - name: IN_CLUSTER
              value: "true"
            # Master key for the Temporal PayloadCodec (apps/backend/src/lib/temporal-codec.ts).
            # Without it this worker builds no converter and cannot decode the encrypted arguments
            # the client sends — every activity would fail on deserialization.
            #
            # `optional: true` so a cluster whose Secret hasn't been created yet still starts: the
            # worker then falls back to the plaintext converter, which matches a client that also
            # has no key. scripts/deploy-worker.sh creates the Secret.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: provisioning-worker-secrets
                  key: JWT_SECRET
                  optional: true
          ports:
            - name: metrics
              containerPort: 9464
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
