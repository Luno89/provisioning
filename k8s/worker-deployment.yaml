apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-worker
  namespace: default
  labels:
    app: provisioning-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioning-worker
  template:
    metadata:
      labels:
        app: provisioning-worker
    spec:
      serviceAccountName: provisioning-worker
      containers:
        - name: worker
          image: nowrinkles/app:dev
          imagePullPolicy: IfNotPresent
          args: ["worker-cluster"]
          env:
            - name: TEMPORAL_CONNECTION_ADDRESS
              value: "host.k3d.internal:7233"
            - name: TEMPORAL_TASK_QUEUE
              value: "cluster-ops-queue"
            - name: IN_CLUSTER
              value: "true"
            - name: TEMPORAL_TLS_CA
              value: /etc/koala/temporal-tls/ca.crt
          envFrom:
            - secretRef:
                name: provisioning-worker-secrets
                optional: true
          ports:
            - name: metrics
              containerPort: 9464
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
            - name: temporal-ca
              mountPath: /etc/koala/temporal-tls
              readOnly: true
      volumes:
        - name: temporal-ca
          secret:
            secretName: provisioning-worker-temporal-ca
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
