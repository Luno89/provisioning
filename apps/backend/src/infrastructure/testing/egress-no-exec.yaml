apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: koala-no-exec
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: koala-no-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: koala-no-exec
subjects:
  - kind: ServiceAccount
    name: koala
    namespace: default
