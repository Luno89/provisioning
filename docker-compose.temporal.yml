version: "3.9"

services:
  postgresql:
    image: postgres:12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-keys:
    image: busybox:1.37
    restart: unless-stopped
    command: ["httpd", "-f", "-p", "7280", "-h", "/srv"]
    volumes:
      - ./apps/backend/data/temporal-keys:/srv/.well-known:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7280/.well-known/temporal-jwks.json"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.3
    ports:
      - "${PLATFORM_BIND:-127.0.0.1}:7233:7233"
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      temporal-keys:
        condition: service_healthy
    environment:
      - TEMPORAL_DATA_DIR=/home/temporal/temporal/data
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - BIND_ON_IP=0.0.0.0
      - SERVICES=frontend:internal-frontend:history:matching:worker
      - USE_INTERNAL_FRONTEND=true
      - TEMPORAL_ADDRESS=127.0.0.1:7236
      - TEMPORAL_AUTH_AUTHORIZER=default
      - TEMPORAL_AUTH_CLAIM_MAPPER=default
      - TEMPORAL_JWT_KEY_SOURCE1=http://temporal-keys:7280/.well-known/temporal-jwks.json
      - TEMPORAL_JWT_KEY_REFRESH=30s
      - TEMPORAL_TLS_FRONTEND_CERT=/etc/temporal/tls/server.crt
      - TEMPORAL_TLS_FRONTEND_KEY=/etc/temporal/tls/server.key
    volumes:
      - tf-data:/home/temporal/temporal
      - ./apps/backend/data/temporal-tls:/etc/temporal/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7236 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  tf-data:
  pg-data:
