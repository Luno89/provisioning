version: "3.9"

services:
  postgresql:
    image: postgres:12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-keys:
    image: busybox:1.37
    restart: unless-stopped
    command: ["httpd", "-f", "-p", "7280", "-h", "/srv"]
    volumes:
      - ./apps/backend/data/temporal-keys:/srv/.well-known:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7280/.well-known/temporal-jwks.json"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    restart: "no"
    labels:
      koala.one-shot: "true"
    depends_on:
      postgresql:
        condition: service_healthy
    entrypoint: ["sh", "/schema/temporal-schema.sh"]
    environment:
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    volumes:
      - ./charts/instance/files/temporal-schema.sh:/schema/temporal-schema.sh:ro

  temporal:
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    ports:
      - "${PLATFORM_BIND:-127.0.0.1}:7233:7233"
      - "127.0.0.1:9233:9233"
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
      temporal-keys:
        condition: service_healthy
    environment:
      - TEMPORAL_DATA_DIR=/home/temporal/temporal/data
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - BIND_ON_IP=0.0.0.0
      - SERVICES=frontend:internal-frontend:history:matching:worker
      - USE_INTERNAL_FRONTEND=true
      - TEMPORAL_ADDRESS=127.0.0.1:7236
      - TEMPORAL_AUTH_AUTHORIZER=default
      - TEMPORAL_AUTH_CLAIM_MAPPER=default
      - TEMPORAL_JWT_KEY_SOURCE1=http://temporal-keys:7280/.well-known/temporal-jwks.json
      - TEMPORAL_JWT_KEY_REFRESH=30s
      - TEMPORAL_TLS_FRONTEND_CERT=/etc/temporal/tls/server.crt
      - TEMPORAL_TLS_FRONTEND_KEY=/etc/temporal/tls/server.key
      - PROMETHEUS_ENDPOINT=0.0.0.0:9233
    volumes:
      - tf-data:/home/temporal/temporal
      - ./charts/instance/files/temporal-dynamic-config.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
      - ./apps/backend/data/temporal-tls:/etc/temporal/tls:ro
volumes:
  tf-data:
  pg-data:
