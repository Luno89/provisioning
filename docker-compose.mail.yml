version: "3.9"

services:
  mail:
    image: nowrinkles/mail:1
    build: ./docker/mail
    container_name: nowrinkles-mail
    restart: unless-stopped
    network_mode: host
    environment:
      MAIL_DOMAIN: ${DOMAIN:-nowrinkles.dev}
      MAIL_PORT: "2525"
      MAIL_RELAYHOST: ${MAIL_RELAYHOST:-}
    volumes:
      - mail-dkim:/var/lib/dkim
      - mail-spool:/var/spool/postfix

volumes:
  mail-dkim:
  mail-spool:
